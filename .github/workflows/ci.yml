name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:tokens
        working-directory: .
      - run: npm run typecheck
      - run: npm run test:forward-contract
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          RESEARCH_INSIGHT_PATH: fixtures/research-insight.v1.json
          FORWARD_HORIZON_PATH: fixtures/forward-horizon.v1.json
          AQIL_ALLOW_RESEARCH_FIXTURE: "true"
          AQIL_FOUNDER_INSIGHT_TOKEN: ci-founder-test-token
          AQIL_ALLOW_FOUNDER_INSIGHT_HEADER: "true"
          E2E_USE_DEV_SERVER: "true"
      - name: Playwright verified macro bundle
        run: npx playwright test e2e/forward-verified-macro.spec.ts --project=verified-macro
        env:
          CI: true
          RESEARCH_INSIGHT_PATH: fixtures/research-insight.v1.json
          FORWARD_HORIZON_PATH: fixtures/forward-horizon-verified-macro.v1.json
          AQIL_ALLOW_RESEARCH_FIXTURE: "true"
          AQIL_FOUNDER_INSIGHT_TOKEN: ci-founder-test-token
          AQIL_ALLOW_FOUNDER_INSIGHT_HEADER: "true"
          E2E_USE_DEV_SERVER: "true"

  database:
    name: Database (Supabase migrations + RLS)
    # Ephemeral local stack only; pgTAP helpers in supabase/tests are not migrations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start Supabase local stack
        run: supabase start -x storage-api,imgproxy
      - run: supabase db reset --no-seed
      - name: Provision local research_worker login
        run: supabase db query -f scripts/provision-research-worker-local.sql
      - run: supabase test db
      - name: Verify generated types match schema
        run: |
          supabase gen types typescript --local --schema public > apps/web/src/types/database.generated.ts
          git diff --exit-code apps/web/src/types/database.generated.ts

  research:
    name: Research worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/research
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start Supabase for persistence integration tests
        working-directory: .
        run: supabase start -x storage-api,imgproxy
      - name: Apply migrations
        working-directory: .
        run: supabase db reset --no-seed
      - name: Provision local research_worker login
        working-directory: .
        run: supabase db query -f scripts/provision-research-worker-local.sql
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          RESEARCH_DATABASE_URL: postgresql://research_worker:research_worker@127.0.0.1:54322/postgres
