name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:tokens
        working-directory: .
      - run: npm run typecheck
      - run: npm run test:forward-contract
      - run: npm run test:auth
      - run: npm run test:saxo
      - run: npm run test:wealth
      - run: npm run test:capital
      - run: npm run test:benchmark
      - run: npm run test:learn
      - run: npm run test:story
      - run: npm run test:sourced-updates
      - run: npm run test:etf
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          RESEARCH_INSIGHT_PATH: fixtures/research-insight.v1.json
          FORWARD_HORIZON_PATH: fixtures/forward-horizon.v1.json
          AQIL_ALLOW_RESEARCH_FIXTURE: "true"
          E2E_USE_DEV_SERVER: "true"

  database:
    name: Database (Supabase migrations + RLS)
    # Ephemeral local stack only; pgTAP helpers in supabase/tests are not migrations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start Supabase local stack
        run: supabase start -x storage-api,imgproxy
      - run: supabase db reset --no-seed
      - name: Provision local research_worker login
        run: supabase db query -f scripts/provision-research-worker-local.sql
      - run: supabase test db
      - name: Verify generated types match schema
        run: |
          supabase gen types typescript --local --schema public > apps/web/src/types/database.generated.ts
          git diff --exit-code apps/web/src/types/database.generated.ts

  research:
    name: Research worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/research
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start Supabase for persistence integration tests
        working-directory: .
        run: supabase start -x storage-api,imgproxy
      - name: Apply migrations
        working-directory: .
        run: supabase db reset --no-seed
      - name: Provision local research_worker login
        working-directory: .
        run: supabase db query -f scripts/provision-research-worker-local.sql
      - name: Prepare disposable database aqil_research_test
        working-directory: .
        run: |
          set -euo pipefail
          container="supabase_db_ojvswermsbbaltjohqph"
          test_database="aqil_research_test"
          if [ "$test_database" != "aqil_research_test" ]; then
            echo "Refusing to prepare a database that is not aqil_research_test." >&2
            exit 1
          fi
          docker exec "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname = '${test_database}' and pid <> pg_backend_pid();"
          docker exec "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "drop database if exists ${test_database};"
          docker exec "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create database ${test_database};"
          docker exec "$container" pg_dump -U postgres -d postgres --schema-only --no-owner -n research -n forward | docker exec -i "$container" psql -U postgres -d "$test_database" -v ON_ERROR_STOP=1
          docker exec "$container" psql -U postgres -d "$test_database" -v ON_ERROR_STOP=1 -c "create table research.test_isolation_marker (marker text primary key); insert into research.test_isolation_marker (marker) values ('disposable-research-test'); revoke all on table research.test_isolation_marker from public, anon, authenticated; grant select on table research.test_isolation_marker to research_writer, research_worker;"
          identity="$(docker exec "$container" psql -U postgres -d "$test_database" -tA -c "select current_database();")"
          identity="$(printf '%s' "$identity" | tr -d '[:space:]')"
          if [ "$identity" != "$test_database" ]; then
            echo "Prepared database identity was ${identity}." >&2
            exit 1
          fi
          echo "Prepared disposable database ${test_database}. The development database was not reset."
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Pytest on aqil_research_test
        run: |
          unset RESEARCH_DATABASE_URL
          uv run pytest
        env:
          AQIL_RESEARCH_TEST_DATABASE_URL: postgresql://research_worker:research_worker@127.0.0.1:55432/aqil_research_test
