name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:tokens
        working-directory: .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true

  database:
    name: Database (Supabase migrations + RLS)
    # Ephemeral local stack only; pgTAP helpers in supabase/tests are not migrations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start Supabase local stack
        run: supabase start -x storage-api,imgproxy
      - run: supabase db reset --no-seed
      - run: supabase test db
      - name: Verify generated types match schema
        run: |
          supabase gen types typescript --local --schema public > apps/web/src/types/database.generated.ts
          git diff --exit-code apps/web/src/types/database.generated.ts

  research:
    name: Research worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/research
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
