# Research pipeline.
#
# The daily cycle module can record a missed UTC day from the last cycle start.
# This workflow does not schedule that cycle. Hosted writes stay refused until
# a tested logical restore exists and the founder arms them. A pull request
# cannot read a live-write secret because this workflow is manual only.
name: Research pipeline (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fixture (offline dry run) or live (refuses unless the arming secret is set)"
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - live

permissions:
  contents: read

concurrency:
  group: research-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-and-run:
    name: Collect and run (fixture)
    if: inputs.mode == 'fixture'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase
        run: supabase start -x storage-api,imgproxy
      - name: Apply migrations and provision worker
        run: |
          supabase db reset --no-seed
          supabase db query -f scripts/provision-research-worker-local.sql
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Fixture collect-and-run
        working-directory: workers/research
        env:
          RESEARCH_DATABASE_URL: postgresql://research_worker:research_worker@127.0.0.1:55432/postgres
        run: |
          uv sync --group dev
          uv run aqil-research collect-and-run \
            --source bls --method sahm \
            --fixture tests/fixtures/bls/api_lns14000000_success.json \
            --start-year 2022 --end-year 2025 \
            --run-id "gha-${{ github.run_id }}" \
            --allow-evaluation-fallback

  live:
    name: Live cycle (armed writes only)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Refuse unless hosted writes are armed
        env:
          AQIL_RESEARCH_LIVE_WRITES: ${{ secrets.AQIL_RESEARCH_LIVE_WRITES }}
        run: |
          if [ "$AQIL_RESEARCH_LIVE_WRITES" != "armed" ]; then
            echo "Refusing live writes. The repository secret AQIL_RESEARCH_LIVE_WRITES is not armed."
            exit 1
          fi
          echo "The secret is armed. Gate 10 still has no tested logical restore, so this job does not write."
          exit 1
