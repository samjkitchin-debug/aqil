# Research pipeline.
#
# The daily cycle module can record a missed UTC day from the last cycle start.
# The 06:15 UTC schedule runs the hosted refresh when the worker secret is set.
# The worker secret is RESEARCH_WORKER_DATABASE_URL. The legacy name
# RESEARCH_DATABASE_URL remains a fallback for this workflow only.
# Vercel keeps the reader role under RESEARCH_DATABASE_URL. Neither value is
# copied into the other system, and neither is stored in Git.
# This workflow has no pull_request trigger, so a fork pull request cannot
# receive the worker secret. The live job does not pass --refit.
name: Research pipeline

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "fixture (offline dry run) or live (runs when RESEARCH_DATABASE_URL is set)"
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - live

permissions:
  contents: read

concurrency:
  group: research-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-and-run:
    name: Collect and run (fixture)
    if: inputs.mode == 'fixture'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase
        run: supabase start -x storage-api,imgproxy
      - name: Apply migrations and provision worker
        run: |
          supabase db reset --no-seed
          supabase db query -f scripts/provision-research-worker-local.sql
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Fixture collect-and-run
        working-directory: workers/research
        env:
          RESEARCH_DATABASE_URL: postgresql://research_worker:research_worker@127.0.0.1:55432/postgres
        run: |
          uv sync --group dev
          uv run aqil-research collect-and-run \
            --source bls --method sahm \
            --fixture tests/fixtures/bls/api_lns14000000_success.json \
            --start-year 2022 --end-year 2025 \
            --run-id "gha-${{ github.run_id }}" \
            --allow-evaluation-fallback

  live:
    name: Live cycle (armed writes only)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Refuse unless the worker connection is set
        env:
          RESEARCH_WORKER_DATABASE_URL: ${{ secrets.RESEARCH_WORKER_DATABASE_URL }}
          RESEARCH_DATABASE_URL: ${{ secrets.RESEARCH_DATABASE_URL }}
        run: |
          if [ -n "$RESEARCH_WORKER_DATABASE_URL" ]; then
            export RESEARCH_DATABASE_URL="$RESEARCH_WORKER_DATABASE_URL"
          fi
          if [ -z "$RESEARCH_DATABASE_URL" ]; then
            echo "Refusing live writes. The worker database secret is not set."
            exit 1
          fi
          echo "Worker connection is set. The value is not printed."
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Hosted refresh
        working-directory: workers/research
        env:
          RESEARCH_WORKER_DATABASE_URL: ${{ secrets.RESEARCH_WORKER_DATABASE_URL }}
          RESEARCH_DATABASE_URL: ${{ secrets.RESEARCH_DATABASE_URL }}
        run: |
          if [ -n "$RESEARCH_WORKER_DATABASE_URL" ]; then
            export RESEARCH_DATABASE_URL="$RESEARCH_WORKER_DATABASE_URL"
          fi
          uv sync --group dev
          uv run aqil-research refresh
