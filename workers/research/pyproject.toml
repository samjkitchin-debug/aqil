[project]
name = "aqil-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "sam.j.kitchin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.14.1",
]

[project.scripts]
aqil-research = "aqil_research:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "integration: requires local Supabase Postgres (RESEARCH_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
